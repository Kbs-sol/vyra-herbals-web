name: Reconcile Payments

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: reconcile-payments
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reconcile endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RECONCILE_URL: ${{ vars.RECONCILE_URL || 'https://www.vyraherbals.com/api/cron/reconcile-payments' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi

          echo "Calling ${RECONCILE_URL}"

          http_code=$(curl \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --output response.txt \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${RECONCILE_URL}")

          echo "HTTP ${http_code}"
          echo "----- response body -----"
          cat response.txt || true
          echo
          echo "-------------------------"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::reconcile endpoint returned HTTP ${http_code}"
            exit 1
          fi
